<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Module Portal</title>
   <script src="https://vuejs.org"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-primary { background: #0056b3; color: white; }
        .btn-success { background: #28a745; color: white; width: 100%; margin-top: 10px; }
        .btn-danger { background: #dc3545; color: white; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        .controls { background: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .control-group { flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #0056b3; }
        .cart-box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        input, select { padding: 10px; width: 100%; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="header">
        <h2>University Course Portal</h2>
        <button class="btn btn-primary" v-on:click="toggleCart" v-bind:disabled="cart.length === 0 && showLessons">
            {{ showLessons ? 'View Cart (' + cart.length + ')' : 'Back to Courses' }}
        </button>
    </div>

    <div v-if="showLessons">
        <div class="controls">
            <div class="control-group">
                <label><strong>Sort By:</strong></label>
                <select v-model="sortBy">
                    <option value="subject">Subject</option>
                    <option value="location">Location</option>
                    <option value="price">Price</option>
                    <option value="spaces">Spaces</option>
                </select>
            </div>
            <div class="control-group">
                <label><strong>Order:</strong></label>
                <select v-model="sortOrder">
                    <option value="asc">Ascending (A-Z / Low-High)</option>
                    <option value="desc">Descending (Z-A / High-Low)</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div class="card" v-for="lesson in sortedLessons" :key="lesson._id">
                <h3>{{ lesson.subject }}</h3>
                <p><strong>Location:</strong> {{ lesson.location }}</p>
                <p><strong>Price:</strong> £{{ lesson.price }}</p>
                <p><strong>Spaces Left:</strong> {{ lesson.spaces }}</p>
                <button class="btn btn-success" v-on:click="addToCart(lesson)" v-bind:disabled="lesson.spaces === 0">
                    {{ lesson.spaces > 0 ? 'Add to Cart' : 'Full' }}
                </button>
            </div>
        </div>
    </div>

    <div v-else class="cart-box">
        <h3>Your Selected Courses</h3>
        <p v-if="cart.length === 0">Your cart is empty.</p>
        <div v-else>
            <div class="cart-item" v-for="(item, index) in cart" :key="index">
                <div><strong>{{ item.subject }}</strong> - {{ item.location }} (£{{ item.price }})</div>
                <button class="btn btn-danger" v-on:click="removeFromCart(index, item)">Remove</button>
            </div>

            <h4 style="margin-top: 25px;">Student Checkout & Sign-Up</h4>
            <label>Full Name (Letters only)</label>
            <input type="text" v-model="customerName" placeholder="e.g. John Doe">

            <label>Phone Number (Numbers only)</label>
            <input type="text" v-model="customerPhone" placeholder="e.g. 07123456789">

            <button class="btn btn-primary" v-on:click="submitCheckout" v-bind:disabled="!isCheckoutValid">
                Complete Checkout
            </button>
        </div>
    </div>
</div>

<script>
new Vue({
    el: '#app',
    data: {
        backendUrl:  'https://cst3144-backend-m01147369.onrender.com',
        lessons: [],
        cart: [],
        showLessons: true,
        sortBy: 'subject',
        sortOrder: 'asc',
        customerName: '',
        customerPhone: ''
    },
    created() {
        this.fetchLessons();
    },
    computed: {
        sortedLessons() {
            return [...this.lessons].sort((a, b) => {
                let modifier = this.sortOrder === 'asc' ? 1 : -1;
                if (a[this.sortBy] < b[this.sortBy]) return -1 * modifier;
                if (a[this.sortBy] > b[this.sortBy]) return 1 * modifier;
                return 0;
            });
        },
        isCheckoutValid() {
            const nameRegex = /^[A-Za-z\s]+$/;
            const phoneRegex = /^[0-9]+$/;
            return nameRegex.test(this.customerName.trim()) && phoneRegex.test(this.customerPhone.trim());
        }
    },
    methods: {
        fetchLessons() {
            fetch(`${this.backendUrl}/lessons`)
                .then(res => res.json())
                .then(data => {
                    this.lessons = data;
                })
                .catch(err => console.error("Error fetching lessons:", err));
        },
        addToCart(lesson) {
            if (lesson.spaces > 0) {
                lesson.spaces--;
                this.cart.push(lesson);
            }
        },
        removeFromCart(index, item) {
            this.cart.splice(index, 1);
            const found = this.lessons.find(l => l._id === item._id);
            if (found) found.spaces++;
        },
        toggleCart() {
            this.showLessons = !this.showLessons;
        },
        submitCheckout() {
            const orderData = {
                name: this.customerName,
                phone: this.customerPhone,
                lessonIDs: this.cart.map(item => item._id),
                spaces: this.cart.length
            };

            fetch(`${this.backendUrl}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(() => {
                const updatePromises = this.lessons.map(lesson => {
                    return fetch(`${this.backendUrl}/lessons/${lesson._id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ spaces: lesson.spaces })
                    });
                });
                return Promise.all(updatePromises);
            })
            .then(() => {
                alert("Order submitted and spaces updated in MongoDB!");
                this.cart = [];
                this.customerName = '';
                this.customerPhone = '';
                this.showLessons = true;
                this.fetchLessons();
            })
            .catch(err => console.error("Checkout failed:", err));
        }
    }
});
</script>
</body>
